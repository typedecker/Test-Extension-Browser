name: Build APK

on:
  workflow_dispatch:
    description: "Build Extension Browser APK"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install Android SDK components (AGP 8.9+ needs SDK 36)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;34.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew || echo "No gradlew found"

      - name: Build APK (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --warning-mode all
          else
            gradle wrapper
            ./gradlew assembleDebug --no-daemon --warning-mode all
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: extension-browser-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: List build outputs
        run: |
          echo "=== Build Outputs ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "No APKs found"
